<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Ultimate Exam Bit Catcher: College Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#4c1d95,#be185d 55%,#f97316);color:#fff;font-family:'Bangers','Comic Sans MS',cursive;letter-spacing:.04em;-webkit-user-select:none;user-select:none;overflow-x:hidden}
.px{font-family:'Press Start 2P','Courier New',monospace}
.ink{text-shadow:3px 3px 0 #000}
.card{border:4px solid #000;box-shadow:0 6px 0 #000}
@keyframes floatup{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.pop{animation:floatup 1s ease-out forwards;pointer-events:none}
@keyframes bg{0%{transform:translateY(105vh) rotate(0)}100%{transform:translateY(-15vh) rotate(360deg)}}
.bgp{position:fixed;top:0;left:0;animation:bg linear infinite;opacity:.25;pointer-events:none;z-index:0}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
.shake{animation:shk .4s linear 2}
@keyframes lz{0%,100%{opacity:.7}50%{opacity:1}}
.lz{animation:lz .15s infinite}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useRef,useEffect}=React;
const html=htm.bind(React.createElement);
const LR=window.lucideReact||{};
const I=n=>LR[n]||(()=>null);
const Heart=I('Heart'),Coffee=I('Coffee'),EyeOff=I('EyeOff'),Send=I('Send'),Vol=I('Volume2'),Mute=I('VolumeX'),Coins=I('Coins'),Trophy=I('Trophy'),Redo=I('RotateCcw'),Play=I('Play'),Zap=I('Zap');
const Mo=window.Motion||{};
const motion=Mo.motion||new Proxy({},{get:(_,t)=>({initial,animate,exit,transition,whileHover,whileTap,...p})=>React.createElement(t,p)});
const AP=Mo.AnimatePresence||(({children})=>children);

const CH=[
 {id:'back',name:'The Backbencher',emoji:'😎',perk:'Pulls bits 40% faster',desc:'Last-row legend. Zero fear.',speed:1.4,lives:3,goal:100,g:'from-orange-400 to-pink-500'},
 {id:'ninja',name:'Ninja Student',emoji:'🥷',perk:'Extra life: starts with 4',desc:'Silent. Deadly. Barely passing.',speed:1,lives:4,goal:100,g:'from-slate-500 to-indigo-600'},
 {id:'nerd',name:'Smart Nerd',emoji:'🤓',perk:'Free Cloak + needs only 85 bits',desc:'Knows half already. Cheats anyway.',speed:1,lives:3,goal:85,g:'from-lime-400 to-emerald-600'}
];
const IT={
 cloak:{n:'Invisibility Cloak',cost:30,Ic:EyeOff,d:'5s totally immune',k:'1'},
 coffee:{n:'Coffee Sip',cost:20,Ic:Coffee,d:'8s of 1.6x copy speed',k:'2'},
 pen:{n:'Distraction Pen',cost:25,Ic:Send,d:'Paper plane! Teacher distracted 3s',k:'3'}
};
const LV=[
 {n:'Normal Invigilator',w:[2.5,4.5],gl:[1.2,2],warn:.75,cctv:false,pr:false},
 {n:'Strict + CCTV',w:[1.8,3.4],gl:[1.5,2.4],warn:.55,cctv:true,pr:false},
 {n:'Principal’s Surprise Round',w:[1.6,3],gl:[1.5,2.6],warn:.5,cctv:true,pr:true}
];
const POPS=['PSST!','GULP!','SCRIBBLE!','NOM NOM!','SHHH!','TAP TAP!'];
const rand=a=>a[0]+Math.random()*(a[1]-a[0]);

const G={phase:'menu',ch:0,lvl:0,lives:3,coins:40,inv:{cloak:0,coffee:0,pen:0},muted:false,score:0,goal:100,hold:false,
 b:{cloak:0,coffee:0,pen:0},ts:'writing',tt:3,tx:200,time:0,pv:false,pt:8,ang:0,lock:0,invT:0,banner:null,pops:[],uid:1,
 shake:0,wasHold:false,popT:0,sndT:0,plane:0,planeX:50,caught:0,danger:false,note:''};

let ac;
function beep(f,d=.08,type='square',v=.04){
 if(G.muted)return;
 try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d);}catch(e){}
}
const banner=(text,col)=>{G.banner={text,col,id:G.uid++,ttl:1.5}};
const pop=(text,x,y)=>G.pops.push({id:G.uid++,text,x,y,ttl:1});

function startLevel(){
 const lv=LV[G.lvl];
 Object.assign(G,{phase:'play',score:0,goal:CH[G.ch].goal,hold:false,b:{cloak:0,coffee:0,pen:0},ts:'writing',tt:rand(lv.w),
  tx:200,time:0,pv:false,pt:rand([6,9]),lock:1,invT:0,caught:0,pops:[]});
 banner('LEVEL '+(G.lvl+1)+': '+lv.n.toUpperCase(),'from-sky-400 to-indigo-600');
}
function startGame(){
 const c=CH[G.ch];
 Object.assign(G,{lvl:0,lives:c.lives,coins:40,inv:{cloak:c.id==='nerd'?1:0,coffee:0,pen:0},phase:'shop',note:''});
}
function useItem(k){
 if(G.phase!=='play'||G.inv[k]<1)return;
 G.inv[k]--;
 if(k==='cloak'){G.b.cloak=5;beep(700,.2,'sine');banner('POOF! INVISIBLE','from-purple-400 to-fuchsia-600')}
 if(k==='coffee'){G.b.coffee=8;beep(900,.15,'sawtooth');pop('SLURP!',50,70)}
 if(k==='pen'){G.b.pen=3;G.ts='distracted';G.plane=G.uid++;G.planeX=G.tx/4;beep(500,.25,'triangle');pop('WHOOSH!',G.tx/4,40)}
}

function step(dt){
 const lv=LV[G.lvl],c=CH[G.ch];
 G.time+=dt;
 for(const k in G.b)G.b[k]=Math.max(0,G.b[k]-dt);
 G.invT=Math.max(0,G.invT-dt);G.lock=Math.max(0,G.lock-dt);G.caught=Math.max(0,G.caught-dt);G.shake=Math.max(0,G.shake-dt);
 // teacher state machine
 if(G.b.pen>0){G.ts='distracted'}
 else{
  if(G.ts==='distracted'){G.ts='writing';G.tt=rand(lv.w)}
  G.tt-=dt;
  if(G.tt<=0){
   if(G.ts==='writing'){G.ts='warn';G.tt=lv.warn;G.wasHold=G.hold;beep(220,.12)}
   else if(G.ts==='warn'){G.ts='glare';G.tt=rand(lv.gl);beep(110,.25,'sawtooth');
     if(G.wasHold&&!G.hold){banner('SMOOTH COPY!','from-lime-400 to-green-600');G.coins+=5;beep(880,.15)}}
   else{G.ts='writing';G.tt=rand(lv.w)}
  }
 }
 if(G.ts==='writing')G.tx=200+Math.sin(G.time*.9)*120;
 // principal
 if(lv.pr){
  G.pt-=dt;
  if(G.pt<=0){
   if(G.pv){G.pv=false;G.pt=rand([7,11])}
   else{G.pv=true;G.pt=3;banner('PRINCIPAL!','from-red-500 to-rose-700');beep(150,.4,'sawtooth')}
  }
 }
 // cctv
 G.ang=lv.cctv?Math.sin(G.time*1.1)*58:90;
 const cam=lv.cctv&&Math.abs(G.ang)<11;
 G.danger=G.ts==='glare'||(G.pv&&G.pt<2.2)||cam;
 // copy
 const ready=G.lock<=0&&G.caught<=0;
 if(G.hold&&ready){
  if(G.danger&&G.b.cloak<=0&&G.invT<=0){
   G.lives--;G.score=Math.max(0,G.score-15);G.caught=1.3;G.invT=1.8;G.shake=.8;G.hold=false;
   banner('CAUGHT!','from-red-500 to-orange-500');pop('💥',50,75);pop('BUSTED!',40,60);beep(90,.5,'sawtooth',.08);
   if(G.lives<=0){G.phase='over';return}
  }else{
   const gain=18*c.speed*(G.b.coffee>0?1.6:1)*dt;
   G.score=Math.min(G.goal,G.score+gain);G.coins+=gain*.3;
   G.popT-=dt;G.sndT-=dt;
   if(G.popT<=0){G.popT=.9;pop(POPS[Math.floor(Math.random()*POPS.length)],35+Math.random()*30,70)}
   if(G.sndT<=0){G.sndT=.12;beep(300+G.score*4,.05,'square',.025)}
  }
 }
 if(G.score>=G.goal){
  beep(660,.3,'triangle');
  if(G.lvl===2){G.phase='win';G.coins+=25;return}
  G.lvl++;G.coins+=25;G.phase='shop';G.note='LEVEL CLEARED! +25 coins';return;
 }
 if(G.banner){G.banner.ttl-=dt;if(G.banner.ttl<=0)G.banner=null}
 G.pops=G.pops.filter(p=>(p.ttl-=dt)>0);
}

const PARTS=Array.from({length:14},(_,i)=>({e:['📚','✏️','📝','⭐','🧠','☕','📎'][i%7],l:(i*37)%97,d:9+(i*5)%11,dl:-(i*2.3)}));

function Teacher({tdx}){
 const face={writing:'🧑‍🏫',warn:'🤨',glare:'😡',distracted:'🤪'}[G.ts];
 return html`<div class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center" style=${{left:tdx+'%',top:'38%'}}>
  ${G.ts==='warn'&&html`<div class="absolute -top-6 text-2xl text-yellow-300 ink">❗</div>`}
  ${G.ts==='writing'&&html`<div class="absolute -top-5 -right-6 text-xl">✍️</div>`}
  <div class="text-[clamp(34px,10vw,64px)] leading-none" style=${{transform:G.ts==='writing'?'scaleX(-1)':'none',filter:G.ts==='glare'?'drop-shadow(0 0 10px #f00)':'none'}}>${face}</div>
  <div class="w-[clamp(28px,8vw,46px)] h-[clamp(18px,5vw,30px)] rounded-t-2xl bg-indigo-800 border-2 border-black -mt-1"></div>
 </div>`;
}

function Arena(){
 const lv=LV[G.lvl],tdx=G.tx/4;
 const hidden=G.b.cloak>0,hold=G.hold&&G.caught<=0;
 const sface=G.caught>0?'😵':hold?'😏':CH[G.ch].emoji;
 const showLaser=G.ts==='glare'&&G.b.pen<=0,pLaser=G.pv&&G.pt<2.2;
 return html`<div class=${'relative w-full aspect-[4/3] rounded-3xl card overflow-hidden bg-gradient-to-b from-amber-200 via-orange-200 to-amber-600 '+(G.shake>0?'shake':'')}>
  <div class="absolute left-[12%] right-[12%] top-[5%] h-[22%] rounded-xl border-4 border-amber-900 bg-gradient-to-br from-emerald-700 to-emerald-900 flex items-center justify-center text-white/80 text-[clamp(14px,4vw,28px)]">
   ${G.ts==='writing'?'E = MC² ... 2+2=?':'SURPRISE TEST!'}
  </div>
  <svg class="absolute inset-0 w-full h-full" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
   ${lv.cctv&&html`<g><g transform=${'rotate('+G.ang+' 200 18)'}><polygon points="200,18 140,295 260,295" fill=${Math.abs(G.ang)<11?'rgba(255,40,40,.45)':'rgba(255,255,120,.28)'}/></g></g>`}
   ${showLaser&&html`<g class="lz"><line x1=${G.tx-8} y1="108" x2="196" y2="235" stroke="#ff2222" stroke-width="5" stroke-linecap="round"/><line x1=${G.tx+8} y1="108" x2="204" y2="235" stroke="#ff2222" stroke-width="5" stroke-linecap="round"/></g>`}
   ${pLaser&&html`<g class="lz"><line x1="335" y1="122" x2="206" y2="238" stroke="#ff7a00" stroke-width="6" stroke-linecap="round"/></g>`}
  </svg>
  ${lv.cctv&&html`<div class="absolute left-1/2 top-[2%] -translate-x-1/2 text-2xl" style=${{transform:'translateX(-50%) rotate('+(G.ang*.5)+'deg)'}}>📹</div>`}
  <${Teacher} tdx=${tdx}/>
  <${AP}>${G.pv&&html`<${motion.div} key="pr" initial=${{x:140,opacity:0}} animate=${{x:0,opacity:1}} exit=${{x:140,opacity:0}} class="absolute right-[5%] top-[40%] flex flex-col items-center">
   <div class="text-[clamp(34px,10vw,60px)] leading-none">${G.pt<2.2?'🧐':'👨‍💼'}</div>
   <div class="px text-[8px] bg-red-600 border-2 border-black px-1 rounded">PRINCIPAL</div><//>`}<//>
  ${G.plane>0&&html`<${motion.div} key=${G.plane} class="absolute text-3xl" initial=${{left:'50%',top:'72%',opacity:1,rotate:-30}} animate=${{left:G.planeX+'%',top:'38%',opacity:[1,1,0],rotate:-10}} transition=${{duration:.9}}>✈️<//>`}
  <div class="absolute left-[10%] bottom-[16%] text-3xl opacity-80">😴<span class="text-xs">💤</span></div>
  <div class="absolute right-[10%] bottom-[16%] text-3xl opacity-80">🥱</div>
  <div class="absolute left-1/2 -translate-x-1/2 bottom-[3%] w-[44%] h-[13%] rounded-xl border-4 border-black bg-gradient-to-b from-amber-700 to-amber-900"></div>
  <div class="absolute left-1/2 -translate-x-1/2 bottom-[13%] flex flex-col items-center" style=${{opacity:hidden?.3:1}}>
   ${G.caught>0&&html`<div class="absolute -top-6 text-3xl">🎓</div>`}
   ${G.b.coffee>0&&html`<div class="absolute -right-6 top-0 text-xl">☕</div>`}
   <div class="text-[clamp(40px,12vw,76px)] leading-none">${sface}</div>
   ${hold&&html`<div class="absolute -bottom-1 -right-8 text-2xl">📄</div>`}
  </div>
  ${hidden&&html`<div class="absolute left-1/2 -translate-x-1/2 bottom-[10%] w-[24%] aspect-square rounded-full border-4 border-dashed border-fuchsia-300 animate-pulse"></div>`}
  ${G.pops.map(p=>html`<div key=${p.id} class="pop absolute text-yellow-300 ink text-[clamp(16px,4.5vw,28px)] -translate-x-1/2" style=${{left:p.x+'%',top:p.y+'%'}}>${p.text}</div>`)}
  ${G.caught>0&&html`<div class="absolute inset-0 bg-red-600/30 pointer-events-none"></div>`}
  <${AP}>${G.banner&&html`<${motion.div} key=${G.banner.id} initial=${{scale:0,rotate:-12,opacity:0}} animate=${{scale:1,rotate:-4,opacity:1}} exit=${{scale:1.5,opacity:0}} class="absolute inset-0 flex items-center justify-center pointer-events-none">
   <div class=${'card rounded-2xl px-4 py-2 text-center text-[clamp(22px,7vw,44px)] ink bg-gradient-to-r '+G.banner.col}>${G.banner.text}</div><//>`}<//>
 </div>`;
}

function App(){
 const [,f]=useState(0);const up=()=>f(x=>x+1);
 useEffect(()=>{
  let last=performance.now(),raf;
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(G.phase==='play'){step(dt);up()}raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop);
  const kd=e=>{if(e.code==='Space'){e.preventDefault();if(!e.repeat)G.hold=true}else if(G.phase==='play'){const k={'1':'cloak','2':'coffee','3':'pen'}[e.key];if(k){useItem(k);up()}}};
  const ku=e=>{if(e.code==='Space')G.hold=false};
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  return()=>{cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku)};
 },[]);
 const c=CH[G.ch],ph=G.phase;
 const btn='card rounded-2xl px-5 py-3 text-2xl ink bg-gradient-to-b from-yellow-300 to-orange-500 active:translate-y-1';
 const bg=html`${PARTS.map((p,i)=>html`<div key=${i} class="bgp text-3xl" style=${{left:p.l+'%',animationDuration:p.d+'s',animationDelay:p.dl+'s'}}>${p.e}</div>`)}`;
 const mute=html`<button aria-label="Toggle sound" onClick=${()=>{G.muted=!G.muted;up()}} class="p-2 rounded-xl bg-black/40">${G.muted?html`<${Mute} size=${20}/>`:html`<${Vol} size=${20}/>`}</button>`;

 let body;
 if(ph==='menu'){
  body=html`<div class="text-center">
   <${motion.h1} initial=${{y:-40,opacity:0}} animate=${{y:0,opacity:1}} class="text-[clamp(34px,9vw,68px)] leading-none ink text-yellow-300">THE ULTIMATE<br/>EXAM BIT CATCHER<//>
   <div class="px text-[10px] sm:text-xs mt-3 text-cyan-200">COLLEGE EDITION</div>
   <p class="mt-4 text-lg sm:text-xl text-white/90">Hold <b class="text-yellow-300">COPY</b> while the teacher’s back is turned. Let go the second you see 🤨!</p>
   <div class="grid sm:grid-cols-3 gap-3 mt-5">
   ${CH.map((x,i)=>html`<${motion.button} key=${x.id} whileHover=${{scale:1.04,rotate:-1}} whileTap=${{scale:.96}} onClick=${()=>{G.ch=i;beep(500,.08);up()}}
     class=${'card rounded-3xl p-4 bg-gradient-to-br '+x.g+(G.ch===i?' ring-4 ring-yellow-300 -translate-y-1':' opacity-80')}>
     <div class="text-6xl">${x.emoji}</div><div class="text-2xl ink mt-1">${x.name}</div>
     <div class="text-sm bg-black/40 rounded-lg px-2 py-1 mt-1 flex items-center justify-center gap-1"><${Zap} size=${14}/>${x.perk}</div>
     <div class="text-sm mt-1 text-white/90">${x.desc}</div><//>`)}
   </div>
   <button class=${btn+' mt-6'} onClick=${()=>{startGame();up()}}><span class="inline-flex items-center gap-2"><${Play} size=${22}/> START EXAM</span></button>
  </div>`;
 }else if(ph==='shop'){
  body=html`<div class="text-center">
   <div class="text-4xl ink text-yellow-300">${G.note||'COLLEGE CANTEEN SHOP'}</div>
   <div class="px text-[10px] mt-2 text-cyan-200">NEXT: LEVEL ${G.lvl+1} · ${LV[G.lvl].n.toUpperCase()}</div>
   <div class="mt-3 inline-flex items-center gap-2 card rounded-xl bg-black/50 px-3 py-1 text-2xl"><${Coins} size=${22} class="text-yellow-300"/>${Math.floor(G.coins)}</div>
   <div class="grid sm:grid-cols-3 gap-3 mt-4">
   ${Object.entries(IT).map(([k,it])=>html`<div key=${k} class="card rounded-2xl bg-indigo-900/80 p-4">
     <${it.Ic} size=${36} class="mx-auto text-yellow-300"/>
     <div class="text-2xl ink mt-1">${it.n}</div><div class="text-sm text-white/80">${it.d}</div>
     <div class="text-sm mt-1">Owned: ${G.inv[k]} · Key ${it.k}</div>
     <button disabled=${Math.floor(G.coins)<it.cost} onClick=${()=>{if(Math.floor(G.coins)>=it.cost){G.coins-=it.cost;G.inv[k]++;beep(800,.1,'triangle');up()}}}
      class="mt-2 card rounded-xl px-4 py-1 text-xl bg-green-500 disabled:opacity-40">BUY · ${it.cost} 🪙</button></div>`)}
   </div>
   <button class=${btn+' mt-6'} onClick=${()=>{G.note='';startLevel();up()}}>ENTER LEVEL ${G.lvl+1} ➜</button>
  </div>`;
 }else if(ph==='play'){
  const pct=G.score/G.goal*100;
  body=html`<div class="space-y-3">
   <div class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-1">${Array.from({length:c.lives}).map((_,i)=>html`<${Heart} key=${i} size=${22} class=${i<G.lives?'text-red-500 fill-red-500':'text-white/30'}/>`)}</div>
    <div class="px text-[9px] sm:text-[10px] text-center">LV ${G.lvl+1}<br/><span class="text-cyan-200">${LV[G.lvl].n}</span></div>
    <div class="flex items-center gap-2"><span class="flex items-center gap-1 text-xl text-yellow-300"><${Coins} size=${18}/>${Math.floor(G.coins)}</span>${mute}</div>
   </div>
   <div><div class="flex justify-between text-lg ink"><span>📚 KNOWLEDGE BAR</span><span>${Math.floor(G.score)}/${G.goal}</span></div>
    <div class="h-6 rounded-full card bg-black/50 overflow-hidden"><div class="h-full bg-gradient-to-r from-lime-300 via-yellow-300 to-pink-500" style=${{width:pct+'%'}}></div></div></div>
   <${Arena}/>
   <div class="flex gap-2 items-stretch">
    <button onPointerDown=${e=>{e.preventDefault();G.hold=true}} onPointerUp=${()=>{G.hold=false}} onPointerLeave=${()=>{G.hold=false}} onPointerCancel=${()=>{G.hold=false}} onContextMenu=${e=>e.preventDefault()}
     class=${'flex-1 touch-none select-none card rounded-2xl py-5 text-2xl sm:text-3xl ink '+(G.hold?'bg-gradient-to-b from-lime-400 to-green-600 translate-y-1':'bg-gradient-to-b from-pink-400 to-red-500')}>
     ${G.hold?'📄 COPYING...':'HOLD TO COPY BIT'}<div class="px text-[8px] mt-1 hidden sm:block">OR HOLD SPACE</div></button>
    ${Object.entries(IT).map(([k,it])=>html`<button key=${k} aria-label=${it.n} disabled=${G.inv[k]<1} onClick=${()=>{useItem(k);up()}}
      class=${'relative card rounded-2xl w-16 sm:w-20 bg-indigo-700 disabled:opacity-40 flex flex-col items-center justify-center '+(G.b[k]>0?'ring-4 ring-yellow-300':'')}>
      <${it.Ic} size=${26}/><span class="text-lg">${G.b[k]>0?G.b[k].toFixed(1)+'s':'x'+G.inv[k]}</span><span class="px text-[8px] hidden sm:block">${it.k}</span></button>`)}
   </div>
  </div>`;
 }else{
  const win=ph==='win';
  body=html`<div class="text-center py-8">
   <${motion.div} initial=${{scale:0,rotate:-20}} animate=${{scale:1,rotate:-3}} class=${'inline-block card rounded-3xl px-6 py-4 text-[clamp(30px,9vw,58px)] ink bg-gradient-to-r '+(win?'from-yellow-300 to-amber-500':'from-red-500 to-rose-700')}>
    ${win?'LEGENDARY TOPPER!':'EXPELLED! 💀'}<//>
   <div class="text-6xl mt-4">${win?'🏆':'📉'}</div>
   <p class="text-xl mt-2">${win?'You cheated the Teacher, the CCTV and the Principal. Respect.':'The invigilator got you one too many times.'}</p>
   <p class="text-xl text-yellow-300">Coins: ${Math.floor(G.coins)}</p>
   <button class=${btn+' mt-5'} onClick=${()=>{G.phase='menu';up()}}><span class="inline-flex items-center gap-2"><${win?Trophy:Redo} size=${22}/> ${win?'PLAY AGAIN':'RETRY'}</span></button>
  </div>`;
 }
 return html`<div class="relative z-10 max-w-2xl mx-auto p-3 sm:p-6">${bg}${body}</div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
